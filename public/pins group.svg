<svg width="221" height="275" viewBox="0 0 221 275" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes pinDrop {
    0%   { transform: translateY(-40px); opacity: 0; }
    60%  { transform: translateY(6px);   opacity: 1; }
    78%  { transform: translateY(-3px); }
    100% { transform: translateY(0);     opacity: 1; }
  }
  @keyframes pinIdle {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }
  svg > g {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation:
      pinDrop 900ms cubic-bezier(0.34, 1.4, 0.4, 1) both,
      pinIdle 2.6s ease-in-out 1.2s infinite;
  }
  /* Stagger by geographic distance from Tunisia (top pin) */
  svg > g:nth-of-type(1) { animation-delay: 0ms,    1200ms; }
  svg > g:nth-of-type(2) { animation-delay: 180ms,  1380ms; }
  svg > g:nth-of-type(3) { animation-delay: 360ms,  1560ms; }
  svg > g:nth-of-type(4) { animation-delay: 540ms,  1740ms; }
  svg > g:nth-of-type(5) { animation-delay: 720ms,  1920ms; }
  svg > g:nth-of-type(6) { animation-delay: 900ms,  2100ms; }
  svg > g:nth-of-type(7) { animation-delay: 1080ms, 2280ms; }
  svg > g:nth-of-type(8) { animation-delay: 1260ms, 2460ms; }
</style>
